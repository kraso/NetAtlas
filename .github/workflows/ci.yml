name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + data:lint + bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 'modules:lint (ningún módulo de src supera 200 líneas; barrels exentos)'
        run: pnpm modules:lint

      - name: Typecheck
        run: pnpm typecheck

      - name: 'dataset:build (seed → SQLite): los tests copian netatlas-seed.sqlite'
        run: pnpm --filter @netatlas/dataset-tools run dataset:build

      - name: Unit + integration tests
        run: pnpm test

      - name: data:lint (invariantes del seed)
        run: pnpm data:lint

      - name: 'data:manifiesto (integridad + compatibilidad de esquema del seed)'
        run: pnpm --filter @netatlas/dataset-tools run data:manifiesto

      - name: 'Benchmark FTS5 (SLO F0: p95 bajo 50 ms sobre 10k)'
        run: pnpm bench

  ui:
    name: UI + PWA — typecheck + tests + build (SW+manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck app
        run: pnpm --filter @netatlas/app typecheck

      - name: 'dataset:build (los tests de la app usan sqlite-integration)'
        run: pnpm --filter @netatlas/dataset-tools run dataset:build

      - name: UI tests (Testing Library + jsdom)
        run: pnpm --filter @netatlas/app test

      - name: Build producción (vite + PWA SW/manifest)
        run: pnpm --filter @netatlas/app build

      - name: Verificar artefactos PWA
        run: |
          test -f apps/app/dist/sw.js
          test -f apps/app/dist/manifest.webmanifest
          test -f apps/app/dist/icons/icon-192.png
          test -f apps/app/dist/icons/icon-512.png

  e2e:
    name: E2E Playwright — flujo crítico + offline
    runs-on: ubuntu-latest
    # La suite son 80 ejecuciones (40 tests × chromium/firefox) con 1 worker por
    # defecto y reintentos en CI, y no cabía en los 15 minutos anteriores: el job
    # moría antes, en la instalación, así que el presupuesto nunca se midió.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 'dataset:build (el backend e2e copia netatlas-seed.sqlite)'
        run: pnpm --filter @netatlas/dataset-tools run dataset:build

      - name: 'Build app (el webServer sirve dist/ con vite preview)'
        run: pnpm --filter @netatlas/app build

      # El filtro va por ruta aunque el nombre ya sea único en el workspace: la
      # app se selecciona explícitamente y no depende de cómo se llame ningún
      # otro paquete (antes ambos se llamaban @netatlas/app y el job de Tauri
      # moría con «Command "tauri" not found»).
      - name: Install browsers
        run: pnpm --filter ./apps/app exec playwright install --with-deps chromium firefox

      # --workers=2: el config fija workers=1 por la memoria del entorno local y
      # deja a CI subirlo. Se invoca por `exec` porque `pnpm <script> -- args`
      # reenvía el `--` literal a Playwright (medido: `playwright test "--" ...`).
      - name: E2E (flujo crítico 28.1.6#3 + 404 + offline PWA)
        run: pnpm --filter ./apps/app exec playwright test --workers=2

  tauri:
    name: Tauri — build binario escritorio
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      # https://github.com/tauri-apps/tauri-action — compila binario sin bundle para CI
      # Por ruta: la app se selecciona explícitamente, sin depender del nombre.
      - name: Build Tauri (release, sin bundle NSIS/MSI)
        run: pnpm --filter ./apps/app exec tauri build --no-bundle

      - name: Verificar binario
        shell: pwsh
        run: Test-Path apps/app/src-tauri/target/release/netatlas-desktop.exe