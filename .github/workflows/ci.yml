name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + data:lint + bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: data:lint (invariantes del seed)
        run: pnpm data:lint

      - name: dataset:build (seed → SQLite)
        run: pnpm --filter @netatlas/dataset-tools run dataset:build

      - name: Benchmark FTS5 (SLO F0: p95 < 50 ms sobre 10k)
        run: pnpm bench