name: Review

# El gate de review corre aquí ADEMÁS de en el hook `pre-commit`: el hook vive en
# `.git/hooks/` de cada clon, así que un clon sin `gga install` —o un commit con
# `--no-verify`— llegaba a main sin que nadie lo mirara. Este job usa el mismo
# GGA, el mismo `.gga` y las mismas reglas (`AGENTS.md`); lo único que cambia es
# el disparador y el alcance: revisa el diff del PR entero, no lo que cada quien
# tenga staged.
#
# No es el workflow que verifica el proyecto (eso es `ci.yml`): aquí no se
# instalan dependencias ni se compila nada, solo se lee el texto del PR y se
# juzga. Por eso tiene su propio archivo: solo tiene sentido en un PR.

on:
  pull_request:

concurrency:
  # Un push nuevo al mismo PR cancela la corrida anterior: el review del commit
  # viejo ya no le sirve a nadie (mismo criterio que `ci.yml`).
  group: review-${{ github.ref }}
  cancel-in-progress: true

# Solo lee: ni comentarios, ni checks, ni escritura al repo.
permissions:
  contents: read

jobs:
  gate:
    name: Gate (GGA sobre el diff del PR)
    runs-on: ubuntu-latest
    # 20 min es la última red, no el límite que decide: GGA se pone su propio
    # tope (`TIMEOUT="900"` en `.gga`, 15 min) y sale con «Provider execution
    # failed» en vez de quedarse colgado, así que el presupuesto del job solo
    # tiene que ser mayor que ese. Medido con el GGA clonado y el proveedor real:
    # el PR del gate (3 ficheros, 122 líneas) resuelve en 14s; un diff de 329
    # ficheros tardó 316s. Los 20 min cubren eso con margen para la instalación.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # El diff del PR (`main...HEAD`) necesita el merge-base: con el clon
          # superficial que trae el action por defecto (1 commit) el rango no
          # resuelve.
          fetch-depth: 0

      # GGA autodetecta la base mirando las ramas LOCALES (`main` > `master` >
      # `develop`), y el checkout de un PR deja `origin/<base>` pero ninguna rama
      # local. Se crea la de verdad, con el nombre real de la base del PR: si
      # algún día la base no fuera main/master/develop, GGA falla con «Set
      # PR_BASE_BRANCH» en vez de revisar el diff contra la rama equivocada.
      - name: Base del PR como rama local
        env:
          # El contexto de GitHub no se interpola dentro del script: entra por
          # variable de entorno y se cita, que es lo que corta la inyección.
          RAMA_BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$RAMA_BASE:refs/heads/$RAMA_BASE"

      # Falla pronto y en claro, antes de instalar nada: sin `.gga` versionado,
      # GGA caería a sus valores por defecto (`*` para todo, sin exclusiones) y
      # revisaría hasta el lockfile y los JSON del dataset — un gate que juzga
      # otra cosa que la acordada, en silencio.
      - name: Requisitos (config versionada + credencial del proveedor)
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          ES_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ ! -f .gga ]; then
            echo "::error title=Falta .gga::La config del gate no está en esta base; sin ella el review no juzga lo que debe. Lleva a main la rama del gate antes de activar el job."
            exit 1
          fi
          if [ -z "$CODEX_API_KEY" ]; then
            # Los secretos no llegan a los PR abiertos desde un fork: ahí se
            # avisa y se sigue, porque bloquearlos dejaría la puerta cerrada sin
            # arreglo posible desde fuera. En cualquier otro caso, faltar la
            # credencial es un fallo, no un pase silencioso.
            if [ "$ES_FORK" = "true" ]; then
              echo "::notice title=Gate omitido::PR desde un fork: los secretos no se comparten con los forks, así que el review no puede correr."
              echo "GATE_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error title=Falta la credencial::Crea el secreto CODEX_API_KEY (u OPENAI_API_KEY) en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: env.GATE_SKIP != 'true'
        with:
          node-version: 22

      # Misma versión de GGA que el hook local (v2.10.1): el veredicto no puede
      # depender de qué clon tenga cada máquina. El binario busca sus libs en
      # `../lib`, así que el clon basta y `install.sh` (que además copia a
      # `$HOME`) no hace falta en CI.
      - name: Instalar GGA (v2.10.1)
        if: env.GATE_SKIP != 'true'
        run: |
          git clone --branch v2.10.1 --depth 1 \
            https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> "$GITHUB_PATH"

      # Proveedor del review: codex, el mismo que el `.gga` local. La versión va
      # fijada, no flotante: un proveedor que cambia bajo los pies cambia el
      # veredicto sin que nadie haya tocado el código.
      - name: Instalar el proveedor (codex)
        if: env.GATE_SKIP != 'true'
        run: npm install -g @openai/codex@0.157.0

      # `--pr-mode` manda el contenido completo de los ficheros cambiados, igual
      # que el hook local manda el de los ficheros staged: misma vista del código
      # en los dos sitios. `--diff-only` no abarata nada — GGA añade el diff
      # *además* del contenido (`build_pr_prompt`), así que solo suma tokens.
      - name: Gate
        if: env.GATE_SKIP != 'true'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
        run: gga run --pr-mode
