[package]
name = "netatlas-desktop"
version = "0.1.0"
description = "NetAtlas — enciclopedia de hardware de redes (escritorio)"
authors = ["NetAtlas team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "netatlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# custom-protocol: bins recomendado para assets embebidos (PWA/escritorio offline)
custom-protocol = ["tauri/custom-protocol"]
